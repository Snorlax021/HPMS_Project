# Application Configuration
spring.application.name=HPMS

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:hpms_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize database
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Configuration
# IMPORTANT: Set JWT_SECRET environment variable in production!
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET:hpms-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Token expiration in milliseconds (default: 24 hours = 86400000ms)

# Security Configuration
# Allow H2 console in development
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging Configuration
logging.level.root=INFO
logging.level.com.hpms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
